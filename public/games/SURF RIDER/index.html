<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surf Rider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <div class="panel-superior">
            <div class="score-box azul">
                <span class="score-label">PUNTOS</span>
                <span class="score-value" id="puntos">0</span>
            </div>
            <div class="score-box naranja">
                <span class="score-label">COMBO</span>
                <span class="score-value" id="combo">x1</span>
            </div>
            <div class="score-box verde">
                <span class="score-label">ESTRELLAS</span>
                <span class="score-value" id="estrellas">0</span>
            </div>
            <div class="score-box oro">
                <span class="score-label">RÉCORD</span>
                <span class="score-value" id="record">0</span>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        
        <div class="controles-info">
            <span class="key">←→↑↓</span> Mover
            <span class="key">ESPACIO</span> Saltar
            <span class="key">A</span> Flip
            <span class="key">S</span> Spin
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
