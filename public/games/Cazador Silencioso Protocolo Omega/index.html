<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cazador Silencioso: Protocolo Omega</title>
    <style>
        :root { --sonar: #00ff41; --bg: #001100; --alert: #ff3333; }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: 'Courier New', monospace; color: var(--sonar); touch-action: none; }
        canvas { display: block; filter: contrast(1.2) brightness(0.9); }
        
        /* Efecto CRT antiguo */
        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px; pointer-events: none; z-index: 10; opacity: 0.6;
        }

        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; padding: 20px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .panel { border: 1px solid var(--sonar); padding: 10px; background: rgba(0,20,0,0.8); min-width: 150px; }
        .big-text { font-size: 24px; font-weight: bold; text-shadow: 0 0 5px var(--sonar); }
        .warn { color: var(--alert); text-shadow: 0 0 5px var(--alert); animation: blink 0.5s infinite; }
        
        #overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); border: 2px solid var(--sonar);
            padding: 40px; text-align: center; pointer-events: auto; z-index: 20;
        }
        button {
            background: transparent; color: var(--sonar); border: 1px solid var(--sonar);
            padding: 15px 30px; font-size: 18px; cursor: pointer; font-family: inherit; margin-top: 20px;
        }
        button:hover { background: var(--sonar); color: #000; }

        @keyframes blink { 50% { opacity: 0.3; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
        <div class="panel">
            <div>SILENCIO</div>
            <div id="noise-display" class="big-text">0%</div>
            <small>Ruido > 80% = DETECTADO</small>
        </div>
        <div class="panel" style="text-align: right;">
            <div>TORPEDOS</div>
            <div id="ammo-display" class="big-text">4/4</div>
            <div style="margin-top:10px;">ENEMIGOS</div>
            <div id="score-display" class="big-text">0</div>
        </div>
    </div>

    <div id="overlay">
        <h1 id="title">CAZADOR SILENCIOSO</h1>
        <p id="desc">Usa el SÓNAR (Espacio/Click) para revelar objetivos.<br>Apunta con el ratón y dispara (Click Izq).<br>Mantente silencioso. Evita las cargas de profundidad.</p>
        <button id="btn-start" onclick="startGame()">INICIAR MISIÓN</button>
    </div>

<script>
/**
 * PROTOCOLO OMEGA - Motor de Juego Submarino Táctico
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Configuración
const CFG = {
    sonarRadius: 300,
    sonarSpeed: 4,
    noiseDecay: 0.3,
    noiseSonar: 25,
    noiseMove: 0.5,
    noiseFire: 60,
    detectionThreshold: 80,
    torpedoSpeed: 6,
    enemySpeed: 1.5
};

// Estado del Juego
let state = {
    running: false,
    lastTime: 0,
    score: 0,
    noise: 0,
    ammo: 4,
    detectedTimer: 0,
    wave: 1
};

// Entidades
let player = { x: 0, y: 0, angle: 0, radius: 15 };
let sonar = { active: false, radius: 0, opacity: 0 };
let enemies = [];
let torpedoes = [];
let particles = [];
let depthCharges = [];

// Input
let mouse = { x: 0, y: 0 };
let keys = {};

// --- SISTEMA CORE ---
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    if (!state.running) {
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
    }
}
window.addEventListener('resize', resize);
resize();

window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mousedown', () => { if(state.running) fireTorpedo(); });
window.addEventListener('keydown', e => { 
    keys[e.code] = true; 
    if(e.code === 'Space' && state.running) activateSonar(); 
});
window.addEventListener('keyup', e => keys[e.code] = false);
// Soporte táctil básico
window.addEventListener('touchstart', e => {
    if(state.running) {
        const t = e.touches[0];
        mouse.x = t.clientX; mouse.y = t.clientY;
        // Tap corto = disparo, mantener = sónar (simplificado a tap=disparo, botón UI para sonar si fuera necesario)
        // Para este demo: tap dispara, doble tap o botón virtual activa sonar. 
        // Simplificación: Click/Tap dispara. Barra espaciadora/Botón virtual Sónar.
        fireTorpedo();
    }
});

// --- LÓGICA DE JUEGO ---

function startGame() {
    state = { ...state, running: true, score: 0, noise: 0, ammo: 4, wave: 1, detectedTimer: 0 };
    enemies = []; torpedoes = []; particles = []; depthCharges = [];
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    spawnWave();
    document.getElementById('overlay').classList.add('hidden');
    state.lastTime = performance.now();
    requestAnimationFrame(loop);
}

function gameOver(reason) {
    state.running = false;
    const ov = document.getElementById('overlay');
    ov.classList.remove('hidden');
    document.getElementById('title').innerText = reason === 'detected' ? "DETECTADO - HUNDIDO" : "SIN MUNICIÓN";
    document.getElementById('desc').innerHTML = `Enemigos neutralizados: ${state.score}<br>Oleada alcanzada: ${state.wave}`;
    document.getElementById('btn-start').innerText = "REINTENTAR MISIÓN";
}

function spawnWave() {
    const count = 2 + Math.floor(state.wave * 1.5);
    for(let i=0; i<count; i++) {
        // Spawnear fuera de pantalla
        let ex, ey;
        do {
            ex = Math.random() * canvas.width;
            ey = Math.random() * canvas.height;
        } while(Math.hypot(ex - player.x, ey - player.y) < 400);

        enemies.push({
            x: ex, y: ey,
            vx: (Math.random() - 0.5) * CFG.enemySpeed,
            vy: (Math.random() - 0.5) * CFG.enemySpeed,
            hp: 1,
            revealed: 0, // 0 = invisible, 1 = fully visible
            type: Math.random() > 0.7 ? 'destroyer' : 'frigate'
        });
    }
}

function activateSonar() {
    if (sonar.active) return;
    sonar.active = true;
    sonar.radius = 10;
    sonar.opacity = 1;
    addNoise(CFG.noiseSonar);
    
    // Revelar enemigos temporalmente
    enemies.forEach(e => {
        const dist = Math.hypot(e.x - player.x, e.y - player.y);
        if (dist < CFG.sonarRadius) e.revealed = 1.0;
    });
}

function fireTorpedo() {
    if (state.ammo <= 0) return;
    state.ammo--;
    addNoise(CFG.noiseFire);
    
    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    torpedoes.push({
        x: player.x, y: player.y,
        vx: Math.cos(angle) * CFG.torpedoSpeed,
        vy: Math.sin(angle) * CFG.torpedoSpeed,
        life: 180 // frames
    });
}

function addNoise(amount) {
    state.noise = Math.min(100, state.noise + amount);
}

function update(dt) {
    // Movimiento Jugador (WASD/Flechas)
    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy = -1;
    if (keys['KeyS'] || keys['ArrowDown']) dy = 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx = -1;
    if (keys['KeyD'] || keys['ArrowRight']) dx = 1;

    if (dx !== 0 || dy !== 0) {
        player.x += dx * 2;
        player.y += dy * 2;
        addNoise(CFG.noiseMove);
        // Mantener en pantalla
        player.x = Math.max(20, Math.min(canvas.width-20, player.x));
        player.y = Math.max(20, Math.min(canvas.height-20, player.y));
    }

    // Ruido decae
    state.noise = Math.max(0, state.noise - CFG.noiseDecay);
    
    // Detección por ruido
    if (state.noise >= CFG.detectionThreshold) {
        state.detectedTimer += dt;
        if (state.detectedTimer > 3) gameOver('detected'); // 3 segundos de ruido alto = muerte
        
        // Generar cargas de profundidad si hay mucho ruido
        if (Math.random() < 0.05) {
            depthCharges.push({
                x: player.x + (Math.random()-0.5)*200,
                y: player.y + (Math.random()-0.5)*200,
                timer: 60
            });
        }
    } else {
        state.detectedTimer = Math.max(0, state.detectedTimer - dt);
    }

    // Actualizar Sónar
    if (sonar.active) {
        sonar.radius += CFG.sonarSpeed;
        sonar.opacity -= 0.015;
        if (sonar.opacity <= 0) sonar.active = false;
    }

    // Actualizar Enemigos
    enemies.forEach(e => {
        e.x += e.vx; e.y += e.vy;
        // Rebote suave en bordes
        if (e.x < 0 || e.x > canvas.width) e.vx *= -1;
        if (e.y < 0 || e.y > canvas.height) e.vy *= -1;
        
        // Decaimiento de visibilidad
        e.revealed = Math.max(0, e.revealed - 0.008);
    });

    // Actualizar Torpedos
    for (let i = torpedoes.length - 1; i >= 0; i--) {
        let t = torpedoes[i];
        t.x += t.vx; t.y += t.vy; t.life--;
        
        // Colisión con enemigos
        let hit = false;
        for (let j = enemies.length - 1; j >= 0; j--) {
            let e = enemies[j];
            if (Math.hypot(t.x - e.x, t.y - e.y) < 30) {
                createExplosion(e.x, e.y);
                enemies.splice(j, 1);
                state.score++;
                state.ammo = Math.min(8, state.ammo + 1); // Recuperar munición
                hit = true;
                break;
            }
        }
        if (hit || t.life <= 0) torpedoes.splice(i, 1);
    }

    // Cargas de Profundidad
    for (let i = depthCharges.length - 1; i >= 0; i--) {
        let dc = depthCharges[i];
        dc.timer--;
        if (dc.timer <= 0) {
            createExplosion(dc.x, dc.y, '#ffaa00');
            if (Math.hypot(dc.x - player.x, dc.y - player.y) < 80) {
                gameOver('detected'); // Muerte por carga
            }
            depthCharges.splice(i, 1);
        }
    }

    // Partículas
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
    particles = particles.filter(p => p.life > 0);

    // Siguiente oleada
    if (enemies.length === 0) {
        state.wave++;
        spawnWave();
    }

    // UI Update
    document.getElementById('noise-display').innerText = Math.floor(state.noise) + '%';
    document.getElementById('noise-display').className = state.noise >= CFG.detectionThreshold ? 'big-text warn' : 'big-text';
    document.getElementById('ammo-display').innerText = `${state.ammo}/8`;
    document.getElementById('score-display').innerText = state.score;
}

function createExplosion(x, y, color = '#0f0') {
    for(let i=0; i<15; i++) {
        particles.push({
            x, y,
            vx: (Math.random()-0.5)*4,
            vy: (Math.random()-0.5)*4,
            life: 30 + Math.random()*20,
            color
        });
    }
}

// --- RENDERIZADO ---
function draw() {
    // Fondo oscuro con ruido sutil
    ctx.fillStyle = '#001100';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid táctico
    ctx.strokeStyle = 'rgba(0,255,65,0.05)';
    ctx.lineWidth = 1;
    const gridSize = 50;
    for(let x=0; x<canvas.width; x+=gridSize) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
    for(let y=0; y<canvas.height; y+=gridSize) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

    // Sónar Pulse
    if (sonar.active) {
        ctx.beginPath();
        ctx.arc(player.x, player.y, sonar.radius, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(0,255,65,${sonar.opacity})`;
        ctx.lineWidth = 3;
        ctx.stroke();
        
        // Relleno sutil del pulso
        ctx.fillStyle = `rgba(0,255,65,${sonar.opacity * 0.1})`;
        ctx.fill();
    }

    // Enemigos (solo visibles si revealed > 0)
    enemies.forEach(e => {
        if (e.revealed > 0.05) {
            ctx.save();
            ctx.globalAlpha = e.revealed;
            ctx.translate(e.x, e.y);
            
            // Forma del barco
            ctx.fillStyle = e.type === 'destroyer' ? '#ff3333' : '#ffaa00';
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(10, 10);
            ctx.lineTo(0, 5);
            ctx.lineTo(-10, 10);
            ctx.closePath();
            ctx.fill();
            
            // Etiqueta
            ctx.fillStyle = '#0f0';
            ctx.font = '10px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(e.type.toUpperCase(), 0, -20);
            
            ctx.restore();
        }
    });

    // Torpedos
    ctx.fillStyle = '#fff';
    torpedoes.forEach(t => {
        ctx.beginPath();
        ctx.arc(t.x, t.y, 3, 0, Math.PI*2);
        ctx.fill();
        // Estela
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.moveTo(t.x, t.y);
        ctx.lineTo(t.x - t.vx*5, t.y - t.vy*5);
        ctx.stroke();
    });

    // Cargas de Profundidad (Alerta)
    depthCharges.forEach(dc => {
        ctx.save();
        ctx.translate(dc.x, dc.y);
        ctx.strokeStyle = `rgba(255,50,50,${Math.abs(Math.sin(dc.timer*0.2))})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 20 + (60-dc.timer), 0, Math.PI*2);
        ctx.stroke();
        ctx.fillStyle = '#f00';
        ctx.font = 'bold 12px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText("!", 0, 4);
        ctx.restore();
    });

    // Jugador
    ctx.save();
    ctx.translate(player.x, player.y);
    const aimAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    ctx.rotate(aimAngle);
    
    // Cuerpo sub
    ctx.fillStyle = '#003300';
    ctx.strokeStyle = '#0f0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 20, 8, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    
    // Torre
    ctx.fillStyle = '#0f0';
    ctx.fillRect(-5, -5, 10, 10);
    ctx.restore();

    // Partículas
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 50;
        ctx.fillRect(p.x, p.y, 3, 3);
    });
    ctx.globalAlpha = 1;

    // Línea de mira
    ctx.strokeStyle = 'rgba(0,255,65,0.3)';
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(mouse.x, mouse.y);
    ctx.stroke();
    ctx.setLineDash([]);
}

function loop(timestamp) {
    if (!state.running) return;
    const dt = Math.min((timestamp - state.lastTime) / 1000, 0.1);
    state.lastTime = timestamp;

    update(dt);
    draw();
    requestAnimationFrame(loop);
}

// Render inicial
draw();
</script>
</body>
</html>
