<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalla Naval - Estrategia</title>
    <style>
        :root {
            --bg-color: #2c3e50;
            --water-color: #3498db;
            --water-hover: #2980b9;
            --hit-color: #e74c3c;
            --miss-color: #ecf0f1;
            --ship-color: #95a5a6;
            --ship-sunk: #7f8c8d;
            --text-color: #ecf0f1;
            --accent: #f1c40f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 { margin-bottom: 10px; color: var(--accent); }
        
        .status-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 8px;
        }

        .game-area {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .board-title { margin-bottom: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(10, 30px);
            grid-template-rows: repeat(10, 30px);
            gap: 2px;
            background-color: #fff;
            padding: 2px;
            border-radius: 4px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .cell {
            width: 30px;
            height: 30px;
            background-color: var(--water-color);
            cursor: pointer;
            position: relative;
            transition: background-color 0.2s;
        }

        /* Tablero del jugador */
        #player-grid .cell.ship { background-color: var(--ship-color); }
        #player-grid .cell.hit { background-color: var(--hit-color) !important; }
        #player-grid .cell.miss { background-color: var(--miss-color) !important; opacity: 0.5; }
        #player-grid .cell.sunk { background-color: #c0392b !important; }

        /* Tablero de la IA */
        #ai-grid .cell { cursor: crosshair; }
        #ai-grid .cell:hover { background-color: var(--water-hover); }
        #ai-grid .cell.hit { background-color: var(--hit-color) !important; cursor: default; }
        #ai-grid .cell.miss { background-color: var(--miss-color) !important; opacity: 0.5; cursor: default; }
        #ai-grid .cell.sunk { background-color: #c0392b !important; }
        
        /* Indicadores visuales */
        .cell.hit::after { content: '✕'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; }
        .cell.miss::after { content: '•'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #7f8c8d; font-size: 20px; }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: var(--accent);
            color: #2c3e50;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        button:disabled { background-color: #7f8c8d; cursor: not-allowed; }

        .setup-controls { margin-bottom: 20px; }

        /* Modal */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal.show { opacity: 1; pointer-events: all; }
        .modal-content {
            background: var(--bg-color); padding: 40px; border-radius: 10px;
            text-align: center; border: 2px solid var(--accent);
        }
        .modal h2 { font-size: 2.5rem; margin-bottom: 20px; }

        @media (max-width: 700px) {
            .grid { grid-template-columns: repeat(10, 25px); grid-template-rows: repeat(10, 25px); }
            .cell { width: 25px; height: 25px; }
        }
    </style>
</head>
<body>

    <h1>Batalla Naval</h1>

    <div class="status-bar">
        <span id="status-text">Coloca tus barcos</span>
    </div>

    <div class="setup-controls" id="setup-controls">
        <button onclick="game.randomizePlayerShips()">Colocar Aleatoriamente</button>
        <button onclick="game.startGame()" id="start-btn" disabled>¡Empezar Batalla!</button>
    </div>

    <div class="game-area">
        <div class="board-container">
            <div class="board-title">Tu Flota</div>
            <div id="player-grid" class="grid"></div>
        </div>
        <div class="board-container">
            <div class="board-title">Flota Enemiga</div>
            <div id="ai-grid" class="grid"></div>
        </div>
    </div>

    <div class="controls">
        <button onclick="game.resetGame()">Reiniciar Juego</button>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">¡Victoria!</h2>
            <p id="modal-msg">Has hundido toda la flota enemiga.</p>
            <button onclick="game.resetGame()">Jugar de Nuevo</button>
        </div>
    </div>

<script>
/**
 * Lógica de Batalla Naval
 */
class BattleshipGame {
    constructor() {
        this.gridSize = 10;
        // Definición de barcos: [nombre, tamaño]
        this.shipTypes = [
            { name: 'Portaaviones', size: 5 },
            { name: 'Acorazado', size: 4 },
            { name: 'Crucero', size: 3 },
            { name: 'Submarino', size: 3 },
            { name: 'Destructor', size: 2 }
        ];

        this.playerGrid = []; // 0: agua, 1: barco, 2: tocado, 3: hundido, 4: agua fallida
        this.aiGrid = [];
        this.playerShips = []; // [{x, y, horizontal, hits, size, sunk}]
        this.aiShips = [];
        
        this.gameState = 'setup'; // setup, playing, gameover
        this.currentTurn = 'player'; // player, ai
        
        // IA State
        this.aiMode = 'hunt'; // hunt (aleatorio), target (buscando alrededor)
        this.aiTargetQueue = []; // Cola de coordenadas a revisar cuando acierta

        this.playerGridEl = document.getElementById('player-grid');
        this.aiGridEl = document.getElementById('ai-grid');
        this.statusText = document.getElementById('status-text');
        this.setupControls = document.getElementById('setup-controls');
        this.startBtn = document.getElementById('start-btn');

        this.init();
    }

    init() {
        this.createEmptyGrid();
        this.renderGrids();
        this.setupControls.style.display = 'flex';
        this.startBtn.disabled = true;
        this.statusText.innerText = "Coloca tus barcos (o usa Aleatorio)";
        
        // Permitir colocación manual simple (clic para rotar/colocar sería complejo, 
        // así que simplificamos: clic en celda vacía coloca el siguiente barco si cabe horizontal)
        // Para mejor UX en este ejemplo, usaremos principalmente el botón aleatorio,
        // pero permitiremos clics para "intentar" colocar.
        this.playerGridEl.addEventListener('click', (e) => {
            if (this.gameState !== 'setup') return;
            const cell = e.target;
            const index = parseInt(cell.dataset.index);
            const x = index % 10;
            const y = Math.floor(index / 10);
            this.tryPlaceNextShip(x, y);
        });
    }

    createEmptyGrid() {
        this.playerGrid = Array(100).fill(0);
        this.aiGrid = Array(100).fill(0);
        this.playerShips = [];
        this.aiShips = [];
        this.aiTargetQueue = [];
        this.aiMode = 'hunt';
    }

    // Intenta colocar el siguiente barco de la lista en (x,y) horizontalmente
    tryPlaceNextShip(x, y) {
        const nextShipIndex = this.playerShips.length;
        if (nextShipIndex >= this.shipTypes.length) return; // Ya todos colocados

        const shipDef = this.shipTypes[nextShipIndex];
        
        // Verificar si cabe horizontalmente
        if (x + shipDef.size > 10) return; // Se sale del tablero

        // Verificar colisiones
        for (let i = 0; i < shipDef.size; i++) {
            if (this.playerGrid[y * 10 + (x + i)] !== 0) return; // Ocupado
        }

        // Colocar
        this.placeShip(this.playerGrid, this.playerShips, x, y, shipDef.size, true);
        this.renderGrids();
        this.checkSetupComplete();
    }

    placeShip(gridArray, shipList, x, y, size, horizontal) {
        const coords = [];
        for (let i = 0; i < size; i++) {
            const cx = horizontal ? x + i : x;
            const cy = horizontal ? y : y + i;
            const index = cy * 10 + cx;
            gridArray[index] = 1; // 1 = Barco
            coords.push(index);
        }
        shipList.push({
            coords: coords,
            hits: 0,
            size: size,
            sunk: false
        });
    }

    randomizePlayerShips() {
        this.playerGrid = Array(100).fill(0);
        this.playerShips = [];
        
        this.shipTypes.forEach(ship => {
            let placed = false;
            while (!placed) {
                const horizontal = Math.random() < 0.5;
                const x = Math.floor(Math.random() * 10);
                const y = Math.floor(Math.random() * 10);
                
                if (this.canPlaceShip(this.playerGrid, x, y, ship.size, horizontal)) {
                    this.placeShip(this.playerGrid, this.playerShips, x, y, ship.size, horizontal);
                    placed = true;
                }
            }
        });
        this.renderGrids();
        this.checkSetupComplete();
    }

    canPlaceShip(grid, x, y, size, horizontal) {
        if (horizontal && x + size > 10) return false;
        if (!horizontal && y + size > 10) return false;

        for (let i = 0; i < size; i++) {
            const cx = horizontal ? x + i : x;
            const cy = horizontal ? y : y + i;
            if (grid[cy * 10 + cx] !== 0) return false;
        }
        return true;
    }

    checkSetupComplete() {
        if (this.playerShips.length === this.shipTypes.length) {
            this.startBtn.disabled = false;
            this.statusText.innerText = "¡Flota lista! Pulsa Empezar.";
        }
    }

    startGame() {
        // Colocar barcos de la IA
        this.aiGrid = Array(100).fill(0);
        this.aiShips = [];
        this.shipTypes.forEach(ship => {
            let placed = false;
            while (!placed) {
                const horizontal = Math.random() < 0.5;
                const x = Math.floor(Math.random() * 10);
                const y = Math.floor(Math.random() * 10);
                if (this.canPlaceShip(this.aiGrid, x, y, ship.size, horizontal)) {
                    this.placeShip(this.aiGrid, this.aiShips, x, y, ship.size, horizontal);
                    placed = true;
                }
            }
        });

        this.gameState = 'playing';
        this.currentTurn = 'player';
        this.setupControls.style.display = 'none';
        this.statusText.innerText = "Tu turno: Dispara al enemigo";
        this.renderGrids();
    }

    renderGrids() {
        this.playerGridEl.innerHTML = '';
        this.aiGridEl.innerHTML = '';

        for (let i = 0; i < 100; i++) {
            // Celda Jugador
            const pCell = document.createElement('div');
            pCell.classList.add('cell');
            pCell.dataset.index = i;
            if (this.playerGrid[i] === 1) pCell.classList.add('ship');
            if (this.playerGrid[i] === 2) pCell.classList.add('hit');
            if (this.playerGrid[i] === 3) pCell.classList.add('sunk');
            if (this.playerGrid[i] === 4) pCell.classList.add('miss');
            this.playerGridEl.appendChild(pCell);

            // Celda IA
            const aCell = document.createElement('div');
            aCell.classList.add('cell');
            aCell.dataset.index = i;
            // No mostramos los barcos de la IA (a menos que estén hundidos o tocados)
            if (this.aiGrid[i] === 2) aCell.classList.add('hit');
            if (this.aiGrid[i] === 3) aCell.classList.add('sunk');
            if (this.aiGrid[i] === 4) aCell.classList.add('miss');
            
            // Evento de disparo
            aCell.addEventListener('click', () => this.playerAttack(i));
            this.aiGridEl.appendChild(aCell);
        }
    }

    playerAttack(index) {
        if (this.gameState !== 'playing' || this.currentTurn !== 'player') return;
        if (this.aiGrid[index] === 2 || this.aiGrid[index] === 3 || this.aiGrid[index] === 4) return; // Ya disparado

        if (this.aiGrid[index] === 1) {
            // Tocado
            this.aiGrid[index] = 2;
            this.statusText.innerText = "¡Impacto! Dispara de nuevo.";
            this.checkSunk(this.aiShips, index, 'ai');
            this.renderGrids();
            
            if (this.checkWin(this.aiShips)) {
                this.endGame(true);
            }
            // El jugador repite turno si acierta? En reglas clásicas sí, pero para equilibrio vs IA simple, pasamos turno.
            // Vamos a hacer que repita turno si acierta (más divertido).
            // this.currentTurn = 'ai'; setTimeout(() => this.aiTurn(), 1000);
        } else {
            // Agua
            this.aiGrid[index] = 4;
            this.statusText.innerText = "Agua... Turno de la IA.";
            this.renderGrids();
            this.currentTurn = 'ai';
            setTimeout(() => this.aiTurn(), 800);
        }
    }

    aiTurn() {
        if (this.gameState !== 'playing') return;

        let targetIndex;

        if (this.aiMode === 'target' && this.aiTargetQueue.length > 0) {
            // Modo Caza: disparar a la cola de objetivos
            targetIndex = this.aiTargetQueue.shift();
            // Si ya fue disparado (por lógica previa), buscar otro en la cola o volver a hunt
            while (this.playerGrid[targetIndex] === 2 || this.playerGrid[targetIndex] === 3 || this.playerGrid[targetIndex] === 4) {
                if (this.aiTargetQueue.length === 0) {
                    this.aiMode = 'hunt';
                    targetIndex = this.getRandomTarget();
                    break;
                }
                targetIndex = this.aiTargetQueue.shift();
            }
        } else {
            // Modo Caza aleatoria
            this.aiMode = 'hunt';
            targetIndex = this.getRandomTarget();
        }

        // Ejecutar disparo IA
        if (this.playerGrid[targetIndex] === 1) {
            this.playerGrid[targetIndex] = 2; // Tocado
            this.statusText.innerText = "La IA ha tocado tu barco.";
            
            // Añadir vecinos a la cola (Arriba, Abajo, Izq, Der)
            this.addNeighborsToQueue(targetIndex);
            this.aiMode = 'target';
            
            this.checkSunk(this.playerShips, targetIndex, 'player');
            this.renderGrids();

            if (this.checkWin(this.playerShips)) {
                this.endGame(false);
            } else {
                // La IA repite turno si acierta
                setTimeout(() => this.aiTurn(), 800);
            }
        } else {
            this.playerGrid[targetIndex] = 4; // Agua
            this.statusText.innerText = "La IA falló. Tu turno.";
            this.renderGrids();
            this.currentTurn = 'player';
        }
    }

    getRandomTarget() {
        let idx;
        do {
            idx = Math.floor(Math.random() * 100);
        } while (this.playerGrid[idx] === 2 || this.playerGrid[idx] === 3 || this.playerGrid[idx] === 4);
        return idx;
    }

    addNeighborsToQueue(index) {
        const x = index % 10;
        const y = Math.floor(index / 10);
        const neighbors = [
            {nx: x, ny: y-1}, {nx: x, ny: y+1},
            {nx: x-1, ny: y}, {nx: x+1, ny: y}
        ];

        neighbors.forEach(n => {
            if (n.nx >= 0 && n.nx < 10 && n.ny >= 0 && n.ny < 10) {
                const nIdx = n.ny * 10 + n.nx;
                // Solo añadir si no está ya en la cola y no ha sido disparado
                if (!this.aiTargetQueue.includes(nIdx) && 
                    this.playerGrid[nIdx] !== 2 && 
                    this.playerGrid[nIdx] !== 3 && 
                    this.playerGrid[nIdx] !== 4) {
                    this.aiTargetQueue.push(nIdx);
                }
            }
        });
    }

    checkSunk(shipList, hitIndex, owner) {
        const ship = shipList.find(s => s.coords.includes(hitIndex));
        if (ship) {
            ship.hits++;
            if (ship.hits === ship.size) {
                ship.sunk = true;
                // Marcar todas las celdas como hundidas (3)
                ship.coords.forEach(idx => {
                    if (owner === 'player') this.playerGrid[idx] = 3;
                    else this.aiGrid[idx] = 3;
                });
                
                // Si la IA hundió un barco, limpiar su cola de objetivos (optimización simple)
                if (owner === 'player') {
                    this.aiTargetQueue = []; 
                    this.aiMode = 'hunt';
                    this.statusText.innerText = "¡La IA hundió tu barco!";
                } else {
                    this.statusText.innerText = "¡Hundiste un barco enemigo!";
                }
            }
        }
    }

    checkWin(shipList) {
        return shipList.every(s => s.sunk);
    }

    endGame(playerWon) {
        this.gameState = 'gameover';
        const modal = document.getElementById('modal');
        const title = document.getElementById('modal-title');
        const msg = document.getElementById('modal-msg');
        
        if (playerWon) {
            title.innerText = "¡VICTORIA!";
            title.style.color = "#2ecc71";
            msg.innerText = "Has destruido la flota enemiga.";
        } else {
            title.innerText = "DERROTA";
            title.style.color = "#e74c3c";
            msg.innerText = "Tu flota ha sido destruida.";
        }
        modal.classList.add('show');
    }

    resetGame() {
        document.getElementById('modal').classList.remove('show');
        this.gameState = 'setup';
        this.currentTurn = 'player';
        this.init();
    }
}

// Iniciar
const game = new BattleshipGame();

</script>
</body>
</html>
