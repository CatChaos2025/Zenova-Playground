<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Memoria Neón</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-wrapper">
        <h1 class="title">🧠 Memoria Neón</h1>

        <!-- Marcador -->
        <div class="score-panel">
            <div class="score-box">
                <span class="label">Movimientos</span>
                <span id="moves">0</span>
            </div>
            <div class="score-box">
                <span class="label">Tiempo</span>
                <span id="timer">0:00</span>
            </div>
            <div class="score-box">
                <span class="label">Parejas</span>
                <span id="pairs">0/8</span>
            </div>
        </div>

        <!-- Selector de dificultad -->
        <div class="difficulty-selector">
            <button id="btn-easy" class="diff-btn active">Fácil (4x4)</button>
            <button id="btn-hard" class="diff-btn">Difícil (6x6)</button>
        </div>

        <!-- Tablero de cartas -->
        <div id="game-board" class="board"></div>

        <!-- Pantalla de Victoria -->
        <div id="win-screen" class="overlay hidden">
            <h2 class="gold">🎉 ¡Victoria!</h2>
            <p>Completado en <span id="final-moves">0</span> movimientos</p>
            <p>Tiempo: <span id="final-time">0:00</span></p>
            <p id="new-record" class="hidden gold">🏆 ¡Nuevo récord!</p>
            <button id="restart-btn">🔄 Jugar de nuevo</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
