<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Dice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        
        /* Título */
        h1 {
            color: white;
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            letter-spacing: 3px;
        }
        
        /* Info superior */
        #info-bar {
            display: flex;
            gap: 30px;
            margin-bottom: 25px;
        }
        .info-item {
            text-align: center;
            color: rgba(255,255,255,0.7);
        }
        .info-value {
            font-size: 28px;
            font-weight: bold;
            color: #ffd93d;
        }
        .info-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Tablero Simon */
        #simon-board {
            position: relative;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: #1a1a2e;
            padding: 15px;
            box-shadow: 0 0 60px rgba(0,0,0,0.5), inset 0 0 30px rgba(0,0,0,0.3);
        }
        
        #buttons-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
        }
        
        .simon-btn {
            position: absolute;
            width: 48%;
            height: 48%;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
            opacity: 0.6;
        }
        
        .simon-btn:hover { opacity: 0.8; }
        
        .simon-btn.active {
            opacity: 1;
            transform: scale(1.05);
            box-shadow: 0 0 30px currentColor;
            z-index: 5;
        }
        
        .simon-btn.disabled {
            cursor: not-allowed;
            opacity: 0.4;
        }
        
        /* Posiciones y colores */
        #btn-green {
            top: 0; left: 0;
            background: #27ae60;
            color: #27ae60;
            border-radius: 100% 0 0 0;
        }
        #btn-red {
            top: 0; right: 0;
            background: #e74c3c;
            color: #e74c3c;
            border-radius: 0 100% 0 0;
        }
        #btn-yellow {
            bottom: 0; left: 0;
            background: #f39c12;
            color: #f39c12;
            border-radius: 0 0 0 100%;
        }
        #btn-blue {
            bottom: 0; right: 0;
            background: #3498db;
            color: #3498db;
            border-radius: 0 0 100% 0;
        }
        
        /* Centro */
        #center-circle {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #1a1a2e;
            border: 4px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        #center-level {
            font-size: 36px;
            font-weight: bold;
            color: white;
        }
        #center-label {
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        /* Mensaje de estado */
        #status {
            margin-top: 25px;
            color: white;
            font-size: 18px;
            height: 30px;
            text-align: center;
        }
        #status.watching { color: #ffd93d; }
        #status.your-turn { color: #51cf66; }
        #status.error { color: #ff6b6b; animation: shake 0.5s; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        /* Botón iniciar */
        #start-btn {
            margin-top: 20px;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 25px rgba(102, 126, 234, 0.4);
        }
        #start-btn.hidden { display: none; }
        
        /* Overlay Game Over */
        #gameover {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #gameover.visible { display: flex; }
        
        .gameover-box {
            background: #1a1a2e;
            border: 2px solid #e74c3c;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            color: white;
        }
        .gameover-box h2 { color: #e74c3c; font-size: 32px; margin-bottom: 15px; }
        .gameover-box p { color: #aaa; margin-bottom: 10px; font-size: 18px; }
        .gameover-box .final-score { font-size: 48px; color: #ffd93d; font-weight: bold; }
        .gameover-box button {
            margin-top: 20px;
            padding: 12px 35px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .gameover-box button:hover { background: #c0392b; }
        
        /* Récord */
        #record-display {
            margin-top: 15px;
            color: rgba(255,255,255,0.5);
            font-size: 13px;
        }
        
        /* Partículas de fondo */
        .bg-particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

<!-- Partículas de fondo -->
<div class="bg-particle" style="left:10%; animation-delay:0s;"></div>
<div class="bg-particle" style="left:20%; animation-delay:2s;"></div>
<div class="bg-particle" style="left:35%; animation-delay:4s;"></div>
<div class="bg-particle" style="left:50%; animation-delay:1s;"></div>
<div class="bg-particle" style="left:65%; animation-delay:3s;"></div>
<div class="bg-particle" style="left:80%; animation-delay:5s;"></div>
<div class="bg-particle" style="left:90%; animation-delay:2.5s;"></div>

<h1>🎵 SIMON DICE</h1>

<div id="info-bar">
    <div class="info-item">
        <div class="info-value" id="score-display">0</div>
        <div class="info-label">Puntos</div>
    </div>
    <div class="info-item">
        <div class="info-value" id="record-display-val">0</div>
        <div class="info-label">Récord</div>
    </div>
    <div class="info-item">
        <div class="info-value" id="speed-display">1x</div>
        <div class="info-label">Velocidad</div>
    </div>
</div>

<div id="simon-board">
    <div id="buttons-container">
        <button class="simon-btn" id="btn-green" data-color="green"></button>
        <button class="simon-btn" id="btn-red" data-color="red"></button>
        <button class="simon-btn" id="btn-yellow" data-color="yellow"></button>
        <button class="simon-btn" id="btn-blue" data-color="blue"></button>
    </div>
    <div id="center-circle">
        <div id="center-level">0</div>
        <div id="center-label">Nivel</div>
    </div>
</div>

<div id="status">Presiona INICIAR para jugar</div>
<button id="start-btn" onclick="startGame()">▶ INICIAR</button>
<div id="record-display">🏆 Récord guardado automáticamente</div>

<!-- Game Over -->
<div id="gameover">
    <div class="gameover-box">
        <h2>❌ ¡ERROR!</h2>
        <p>Secuencia incorrecta</p>
        <div class="final-score" id="final-score">0</div>
        <p style="font-size:14px; color:#888;">Nivel alcanzado: <span id="final-level">0</span></p>
        <button onclick="restartGame()">🔄 Jugar de Nuevo</button>
    </div>
</div>

<script>
// ===== AUDIO (Web Audio API) =====
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

const TONES = {
    green: 392,   // G4
    red: 330,     // E4
    yellow: 262,  // C4
    blue: 196     // G3
};

function playTone(color, duration = 300) {
    if (!audioCtx) audioCtx = new AudioCtx();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.type = 'sine';
    osc.frequency.value = TONES[color];
    
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration / 1000);
    
    osc.start();
    osc.stop(audioCtx.currentTime + duration / 1000);
}

function playErrorSound() {
    if (!audioCtx) audioCtx = new AudioCtx();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.type = 'sawtooth';
    osc.frequency.value = 100;
    
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
}

// ===== ESTADO DEL JUEGO =====
let game = {
    sequence: [],
    playerIndex: 0,
    level: 0,
    score: 0,
    record: parseInt(localStorage.getItem('simonRecord')) || 0,
    isShowingSequence: false,
    isPlayerTurn: false,
    speed: 600, // ms entre cada paso
    colors: ['green', 'red', 'yellow', 'blue']
};

// ===== ELEMENTOS DOM =====
const buttons = {
    green: document.getElementById('btn-green'),
    red: document.getElementById('btn-red'),
    yellow: document.getElementById('btn-yellow'),
    blue: document.getElementById('btn-blue')
};

const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start-btn');
const centerLevel = document.getElementById('center-level');

// Mostrar récord inicial
document.getElementById('record-display-val').innerText = game.record;

// ===== LÓGICA DEL JUEGO =====

function startGame() {
    game.sequence = [];
    game.level = 0;
    game.score = 0;
    game.speed = 600;
    game.isPlayerTurn = false;
    
    startBtn.classList.add('hidden');
    updateUI();
    
    nextRound();
}

function restartGame() {
    document.getElementById('gameover').classList.remove('visible');
    startGame();
}

function nextRound() {
    game.level++;
    game.playerIndex = 0;
    
    // Añadir nuevo paso a la secuencia
    const randomColor = game.colors[Math.floor(Math.random() * 4)];
    game.sequence.push(randomColor);
    
    // Aumentar velocidad cada 5 niveles
    if (game.level % 5 === 0) {
        game.speed = Math.max(200, game.speed - 50);
    }
    
    updateUI();
    setStatus('👀 Observa la secuencia...', 'watching');
    disableButtons();
    
    // Mostrar secuencia después de una pausa
    setTimeout(() => showSequence(), 800);
}

function showSequence() {
    game.isShowingSequence = true;
    let i = 0;
    
    const interval = setInterval(() => {
        if (i >= game.sequence.length) {
            clearInterval(interval);
            game.isShowingSequence = false;
            game.isPlayerTurn = true;
            enableButtons();
            setStatus('🎯 ¡Tu turno! Repite la secuencia', 'your-turn');
            return;
        }
        
        const color = game.sequence[i];
        lightUp(color, game.speed * 0.6);
        playTone(color, game.speed * 0.6);
        
        i++;
    }, game.speed);
}

function lightUp(color, duration) {
    const btn = buttons[color];
    btn.classList.add('active');
    
    setTimeout(() => {
        btn.classList.remove('active');
    }, duration);
}

function handlePlayerInput(color) {
    if (!game.isPlayerTurn || game.isShowingSequence) return;
    
    // Feedback visual y sonoro
    lightUp(color, 200);
    playTone(color, 200);
    
    // Verificar si es correcto
    if (color === game.sequence[game.playerIndex]) {
        game.playerIndex++;
        
        // ¿Completó la secuencia?
        if (game.playerIndex === game.sequence.length) {
            game.isPlayerTurn = false;
            game.score += game.level * 10;
            updateUI();
            setStatus('✅ ¡Correcto! Siguiente nivel...', 'your-turn');
            disableButtons();
            
            setTimeout(() => nextRound(), 1200);
        }
    } else {
        // ¡Error!
        gameOver();
    }
}

function gameOver() {
    game.isPlayerTurn = false;
    playErrorSound();
    
    // Flash rojo en todos los botones
    Object.values(buttons).forEach(btn => {
        btn.style.opacity = '1';
        btn.style.background = '#e74c3c';
    });
    
    setTimeout(() => {
        Object.values(buttons).forEach(btn => {
            btn.style.opacity = '';
            btn.style.background = '';
        });
    }, 500);
    
    // Actualizar récord
    if (game.score > game.record) {
        game.record = game.score;
        localStorage.setItem('simonRecord', game.record);
        document.getElementById('record-display-val').innerText = game.record;
    }
    
    // Mostrar game over
    setTimeout(() => {
        document.getElementById('final-score').innerText = game.score;
        document.getElementById('final-level').innerText = game.level;
        document.getElementById('gameover').classList.add('visible');
    }, 700);
    
    setStatus('❌ ¡Secuencia incorrecta!', 'error');
    disableButtons();
}

// ===== UI =====

function updateUI() {
    document.getElementById('score-display').innerText = game.score;
    centerLevel.innerText = game.level;
    
    // Velocidad como multiplicador
    const speedMult = (600 / game.speed).toFixed(1);
    document.getElementById('speed-display').innerText = speedMult + 'x';
}

function setStatus(text, className) {
    statusEl.innerText = text;
    statusEl.className = className || '';
}

function disableButtons() {
    Object.values(buttons).forEach(btn => btn.classList.add('disabled'));
}

function enableButtons() {
    Object.values(buttons).forEach(btn => btn.classList.remove('disabled'));
}

// ===== EVENT LISTENERS =====

// Click
Object.entries(buttons).forEach(([color, btn]) => {
    btn.addEventListener('click', () => handlePlayerInput(color));
});

// Teclado (1-4 o G/R/Y/B)
window.addEventListener('keydown', (e) => {
    const keyMap = {
        'Digit1': 'green', 'KeyG': 'green',
        'Digit2': 'red', 'KeyR': 'red',
        'Digit3': 'yellow', 'KeyY': 'yellow',
        'Digit4': 'blue', 'KeyB': 'blue'
    };
    
    if (keyMap[e.code]) {
        handlePlayerInput(keyMap[e.code]);
    }
});

// Touch (para móviles)
Object.entries(buttons).forEach(([color, btn]) => {
    btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handlePlayerInput(color);
    });
});

</script>
</body>
</html>
