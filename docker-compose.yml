version: '3.8'

services:
  zenova-app:
    build: .
    container_name: zenova_container
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/src/server/node_modules
      - /app/src/client/node_modules
    env_file:
      - .env