<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conecta los Puntos - Tú vs IA</title>
<style>
    :root {
        --bg-color: #1a1a2e;
        --p1-color: #4cc9f0;
        --p2-color: #f72585;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
        background-color: var(--bg-color);
        color: white;
        font-family: 'Segoe UI', sans-serif;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        min-height: 100vh;
    }
    header { text-align: center; margin-bottom: 12px; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; }

    .scoreboard { display: flex; gap: 30px; font-size: 1.2rem; font-weight: bold; }
    .player-score { padding: 8px 16px; border-radius: 8px; transition: all 0.3s; opacity: 0.5; }
    .player-score.active { opacity: 1; transform: scale(1.1); box-shadow: 0 0 15px rgba(255,255,255,0.15); }
    #p1-score { background: rgba(76,201,240,0.1); border: 2px solid var(--p1-color); color: var(--p1-color); }
    #p2-score { background: rgba(247,37,133,0.1); border: 2px solid var(--p2-color); color: var(--p2-color); }

    #status { margin-top: 10px; font-size: 1rem; height: 1.4em; color: #aaa; }
    #status.thinking { color: var(--p2-color); animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.4; } }

    .game-container {
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border-radius: 12px; background: #16213e; padding: 10px;
    }
    canvas { display: block; cursor: crosshair; border-radius: 8px; touch-action: none; }

    .controls { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    button {
        padding: 10px 18px; border: none; border-radius: 6px;
        background: #e94560; color: white; font-weight: bold; cursor: pointer;
    }
    button:active { transform: scale(0.95); }
    .diff-btn { background: #2d3a5f; color: #aaa; }
    .diff-btn.active { background: #4cc9f0; color: #101020; }

    .modal {
        position: fixed; inset: 0; background: rgba(0,0,0,0.85);
        display: flex; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 10;
    }
    .modal.show { opacity: 1; pointer-events: all; }
    .modal-content { background: #16213e; padding: 40px; border-radius: 15px; text-align: center; border: 2px solid #e94560; }
    .winner-text { font-size: 2rem; margin-bottom: 20px; }
</style>
</head>
<body>

<header>
    <h1>Conecta los Puntos</h1>
    <div class="scoreboard">
        <div id="p1-score" class="player-score active">Tú: 0</div>
        <div id="p2-score" class="player-score">IA: 0</div>
    </div>
    <div id="status">Tu turno</div>
</header>

<div class="game-container">
    <canvas id="gameCanvas"></canvas>
</div>

<div class="controls">
    <button class="diff-btn" onclick="game.setDifficulty('facil', this)">Fácil</button>
    <button class="diff-btn active" onclick="game.setDifficulty('normal', this)">Normal</button>
    <button class="diff-btn" onclick="game.setDifficulty('dificil', this)">Difícil</button>
    <button onclick="game.reset()">Reiniciar</button>
</div>

<div id="winModal" class="modal">
    <div class="modal-content">
        <div class="winner-text" id="winnerText"></div>
        <button onclick="game.reset(); document.getElementById('winModal').classList.remove('show')">Jugar de Nuevo</button>
    </div>
</div>

<script>
class DotsAndBoxes {
    constructor(canvasId, gridSize = 5) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.gridSize = gridSize;
        this.spacing = 60;
        this.padding = 40;
        this.dotRadius = 6;
        this.lineWidth = 5;

        this.hLines = []; // 0 = vacío, 1 = humano, 2 = IA
        this.vLines = [];
        this.boxes  = []; // 0 = vacía, 1/2 = dueño
        this.currentPlayer = 1;
        this.scores = { 1: 0, 2: 0 };
        this.hoverLine = null;
        this.isGameOver = false;
        this.aiThinking = false;
        this.aiTimeout = null;
        this.difficulty = 'normal';

        this.colors = { 1: '#4cc9f0', 2: '#f72585', bg: '#16213e', dot: '#ffffff' };

        setTimeout(() => {
            this.init();
            this.bindEvents();
            window.addEventListener('resize', () => this.draw());
        }, 100);
    }

    init() {
        const size = (this.gridSize - 1) * this.spacing + this.padding * 2;
        this.canvas.width = size; this.canvas.height = size;
        this.canvas.style.width = size + 'px'; this.canvas.style.height = size + 'px';

        this.hLines = Array.from({length: this.gridSize}, () => Array(this.gridSize - 1).fill(0));
        this.vLines = Array.from({length: this.gridSize - 1}, () => Array(this.gridSize).fill(0));
        this.boxes  = Array.from({length: this.gridSize - 1}, () => Array(this.gridSize - 1).fill(0));

        this.currentPlayer = 1;
        this.scores = { 1: 0, 2: 0 };
        this.isGameOver = false;
        this.aiThinking = false;
        this.hoverLine = null;
        clearTimeout(this.aiTimeout);

        this.updateUI();
        this.draw();
        requestAnimationFrame(() => this.draw());
    }

    reset() { this.init(); document.getElementById('winModal').classList.remove('show'); }

    setDifficulty(d, btn) {
        this.difficulty = d;
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        this.reset();
    }

    /* ---------- ENTRADA ---------- */
    bindEvents() {
        this.canvas.addEventListener('mousemove', (e) => {
            if (this.isGameOver || this.currentPlayer !== 1) return;
            const pos = this.getMousePos(e);
            const newHover = this.getLineFromPos(pos.x, pos.y);
            if (JSON.stringify(newHover) !== JSON.stringify(this.hoverLine)) {
                this.hoverLine = newHover; this.draw();
            }
        });
        this.canvas.addEventListener('mouseleave', () => { this.hoverLine = null; this.draw(); });
        this.canvas.addEventListener('click', () => {
            if (this.isGameOver || this.currentPlayer !== 1 || !this.hoverLine) return;
            this.makeMove(this.hoverLine);
        });
        this.canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (this.isGameOver || this.currentPlayer !== 1) return;
            const t = e.touches[0], rect = this.canvas.getBoundingClientRect();
            const pos = {
                x: (t.clientX - rect.left) * (this.canvas.width / rect.width),
                y: (t.clientY - rect.top) * (this.canvas.height / rect.height)
            };
            const line = this.getLineFromPos(pos.x, pos.y);
            if (line) this.makeMove(line);
        }, { passive: false });
    }

    getMousePos(e) {
        const rect = this.canvas.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) * (this.canvas.width / rect.width),
            y: (e.clientY - rect.top) * (this.canvas.height / rect.height)
        };
    }

    getLineFromPos(x, y) {
        const gx = (x - this.padding) / this.spacing;
        const gy = (y - this.padding) / this.spacing;
        const col = Math.round(gx), row = Math.round(gy);
        const dx = Math.abs(gx - col), dy = Math.abs(gy - row);

        if (dy < 0.3 && dx > 0.3 && dx < 0.7) {
            const r = row, c = (gx > col) ? col : col - 1;
            if (r >= 0 && r < this.gridSize && c >= 0 && c < this.gridSize - 1 && !this.hLines[r][c])
                return { type: 'h', r, c };
        }
        if (dx < 0.3 && dy > 0.3 && dy < 0.7) {
            const c = col, r = (gy > row) ? row : row - 1;
            if (c >= 0 && c < this.gridSize && r >= 0 && r < this.gridSize - 1 && !this.vLines[r][c])
                return { type: 'v', r, c };
        }
        return null;
    }

    /* ---------- LÓGICA ---------- */
    makeMove(line) {
        if (line.type === 'h') this.hLines[line.r][line.c] = this.currentPlayer;
        else this.vLines[line.r][line.c] = this.currentPlayer;

        const closed = this.checkBoxes(line);
        if (closed > 0) {
            this.scores[this.currentPlayer] += closed; // turno extra
            this.checkWinCondition();
        } else {
            this.currentPlayer = this.currentPlayer === 1 ? 2 : 1;
        }

        this.hoverLine = null;
        this.updateUI();
        this.draw();

        if (!this.isGameOver && this.currentPlayer === 2) this.scheduleAI();
    }

    boxSides(r, c, h, v) {
        return (h[r][c]?1:0) + (h[r+1][c]?1:0) + (v[r][c]?1:0) + (v[r][c+1]?1:0);
    }

    adjacentBoxes(line) {
        const list = [];
        if (line.type === 'h') {
            if (line.r > 0) list.push([line.r - 1, line.c]);
            if (line.r < this.gridSize - 1) list.push([line.r, line.c]);
        } else {
            if (line.c > 0) list.push([line.r, line.c - 1]);
            if (line.c < this.gridSize - 1) list.push([line.r, line.c]);
        }
        return list;
    }

    completesBox(line, h = this.hLines, v = this.vLines) {
        return this.adjacentBoxes(line).filter(([r, c]) => this.boxSides(r, c, h, v) === 3).length;
    }

    checkBoxes(line) {
        let closed = 0;
        for (const [r, c] of this.adjacentBoxes(line)) {
            if (!this.boxes[r][c] && this.boxSides(r, c, this.hLines, this.vLines) === 4) {
                this.boxes[r][c] = this.currentPlayer;
                closed++;
            }
        }
        return closed;
    }

    checkWinCondition() {
        const total = (this.gridSize - 1) ** 2;
        if (this.scores[1] + this.scores[2] === total) {
            this.isGameOver = true;
            const w = this.scores[1] > this.scores[2] ? "¡Ganaste! 🎉" :
                      this.scores[2] > this.scores[1] ? "La IA gana 🤖" : "¡Empate!";
            setTimeout(() => {
                document.getElementById('winnerText').innerText = w;
                document.getElementById('winModal').classList.add('show');
            }, 400);
        }
    }

    /* ---------- IA ---------- */
    scheduleAI() {
        this.aiThinking = true;
        this.updateUI();
        this.aiTimeout = setTimeout(() => {
            this.aiThinking = false;
            const move = this.getAIMove();
            if (move) this.makeMove(move);
        }, 600 + Math.random() * 500);
    }

    getAvailableMoves() {
        const moves = [];
        for (let r = 0; r < this.gridSize; r++)
            for (let c = 0; c < this.gridSize - 1; c++)
                if (!this.hLines[r][c]) moves.push({ type: 'h', r, c });
        for (let r = 0; r < this.gridSize - 1; r++)
            for (let c = 0; c < this.gridSize; c++)
                if (!this.vLines[r][c]) moves.push({ type: 'v', r, c });
        return moves;
    }

    // Simula cuántas cajas encadenadas perderías si la IA hace este movimiento
    chainLoss(line) {
        const h = this.hLines.map(r => r.slice());
        const v = this.vLines.map(r => r.slice());
        const boxes = this.boxes.map(r => r.slice());
        if (line.type === 'h') h[line.r][line.c] = 2; else v[line.r][line.c] = 2;

        let loss = 0;
        while (true) {
            let found = null;
            outer:
            for (let r = 0; r < this.gridSize - 1; r++)
                for (let c = 0; c < this.gridSize - 1; c++)
                    if (!boxes[r][c] && this.boxSides(r, c, h, v) === 3) { found = [r, c]; break outer; }
            if (!found) break;
            const [r, c] = found;
            if (!h[r][c]) h[r][c] = 1;
            else if (!h[r+1][c]) h[r+1][c] = 1;
            else if (!v[r][c]) v[r][c] = 1;
            else v[r][c+1] = 1;
            boxes[r][c] = 1;
            loss++;
        }
        return loss;
    }

    getAIMove() {
        const moves = this.getAvailableMoves();
        if (!moves.length) return null;
        const rand = arr => arr[Math.floor(Math.random() * arr.length)];

        // 1) Si puede cerrar caja, lo hace
        const capturing = moves.filter(m => this.completesBox(m) > 0);
        if (capturing.length && (this.difficulty !== 'facil' || Math.random() < 0.7))
            return rand(capturing);
        if (this.difficulty === 'facil') return rand(moves);

        // 2) Movimientos seguros (no te regalan caja)
        const safe = moves.filter(m => this.chainLoss(m) === 0);
        if (safe.length) return rand(safe);

        // 3) Sacrificio: regalar la cadena más corta
        if (this.difficulty === 'dificil') {
            let best = moves[0], bestLoss = Infinity;
            for (const m of moves) {
                const loss = this.chainLoss(m);
                if (loss < bestLoss) { bestLoss = loss; best = m; }
            }
            return best;
        }
        return rand(moves);
    }

    /* ---------- UI Y DIBUJO ---------- */
    updateUI() {
        document.getElementById('p1-score').innerText = `Tú: ${this.scores[1]}`;
        document.getElementById('p2-score').innerText = `IA: ${this.scores[2]}`;
        document.getElementById('p1-score').classList.toggle('active', this.currentPlayer === 1);
        document.getElementById('p2-score').classList.toggle('active', this.currentPlayer === 2);

        const st = document.getElementById('status');
        if (this.currentPlayer === 2) { st.innerText = 'IA pensando…'; st.classList.add('thinking'); }
        else { st.innerText = 'Tu turno'; st.classList.remove('thinking'); }
    }

    draw() {
        if (!this.ctx || !this.canvas.width) return;
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        ctx.fillStyle = this.colors.bg;
        ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        // Cajas capturadas
        for (let r = 0; r < this.gridSize - 1; r++)
            for (let c = 0; c < this.gridSize - 1; c++)
                if (this.boxes[r][c]) {
                    ctx.globalAlpha = 0.3;
                    ctx.fillStyle = this.colors[this.boxes[r][c]];
                    ctx.fillRect(this.padding + c * this.spacing, this.padding + r * this.spacing, this.spacing, this.spacing);
                    ctx.globalAlpha = 1;
                }

        // Líneas (con el color de quien las puso)
        ctx.lineWidth = this.lineWidth; ctx.lineCap = 'round'; ctx.setLineDash([]);
        for (let r = 0; r < this.gridSize; r++)
            for (let c = 0; c < this.gridSize - 1; c++)
                if (this.hLines[r][c]) this.drawSeg(r, c, 'h', this.colors[this.hLines[r][c]]);
        for (let r = 0; r < this.gridSize - 1; r++)
            for (let c = 0; c < this.gridSize; c++)
                if (this.vLines[r][c]) this.drawSeg(r, c, 'v', this.colors[this.vLines[r][c]]);

        // Preview del jugador humano
        if (this.hoverLine && !this.isGameOver && this.currentPlayer === 1) {
            ctx.globalAlpha = 0.6; ctx.setLineDash([5, 5]);
            this.drawSeg(this.hoverLine.r, this.hoverLine.c, this.hoverLine.type, this.colors[1]);
            ctx.setLineDash([]); ctx.globalAlpha = 1;
        }

        // Puntos
        ctx.fillStyle = this.colors.dot;
        for (let r = 0; r < this.gridSize; r++)
            for (let c = 0; c < this.gridSize; c++) {
                ctx.beginPath();
                ctx.arc(this.padding + c * this.spacing, this.padding + r * this.spacing, this.dotRadius, 0, Math.PI * 2);
                ctx.fill();
            }
    }

    drawSeg(r, c, type, color) {
        const ctx = this.ctx;
        const x = this.padding + c * this.spacing;
        const y = this.padding + r * this.spacing;
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(x, y);
        if (type === 'h') ctx.lineTo(x + this.spacing, y);
        else ctx.lineTo(x, y + this.spacing);
        ctx.stroke();
    }
}

document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => { window.game = new DotsAndBoxes('gameCanvas', 5); }, 50);
});
</script>
</body>
</html>
