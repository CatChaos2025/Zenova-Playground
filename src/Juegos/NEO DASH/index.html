<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO DASH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <header>
            <h1>⚡ NEO DASH</h1>
            <p class="subtitulo">Salta. Evita. Sobrevive.</p>
        </header>
        
        <div class="panel-superior">
            <div class="score-box">
                <span class="score-label">PUNTOS</span>
                <span class="score-value" id="score">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">MEJOR</span>
                <span class="score-value" id="record">0</span>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div class="controles-info">
            <span class="key">ESPACIO</span> o <span class="key">CLICK</span> para Saltar
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
