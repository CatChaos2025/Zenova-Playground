<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALAXY DEFENDERS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <canvas id="gameCanvas" width="600" height="800"></canvas>
        <div class="ui-overlay">
            <div class="score-box">
                <span class="score-label">PUNTOS</span>
                <span class="score-value" id="score">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">VIDA</span>
                <div class="barra-vida">
                    <div class="barra-relleno" id="barraVida"></div>
                </div>
            </div>
            <div class="score-box">
                <span class="score-label">RÉCORD</span>
                <span class="score-value" id="record">0</span>
            </div>
        </div>
        <div class="controles-info">
            <span class="key">←→</span> Mover
            <span class="key">ESPACIO</span> Disparar
            <span class="key">X</span> Bomba
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
