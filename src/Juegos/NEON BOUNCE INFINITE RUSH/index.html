<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON BOUNCE: INFINITE RUSH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <header class="hud">
            <div class="score-box">
                <span class="label">ALTURA</span>
                <span id="score" class="value">0m</span>
            </div>
            <div class="frenzy-box">
                <span class="label">FRENESÍ</span>
                <div class="bar-container"><div id="frenzy-bar" class="bar"></div></div>
            </div>
        </header>

        <canvas id="c"></canvas>

        <div id="overlay" class="overlay active">
            <h1 id="overlay-title">NEON BOUNCE</h1>
            <p id="overlay-subtitle">Rebota. Gira. Sobrevive al vacío.</p>
            <button id="start-btn">INICIAR CAÍDA</button>
            <div class="controls-hint">← → Mover | ESPACIO Impulso Extra</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
